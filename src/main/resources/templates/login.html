<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-5">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-dark text-white text-center py-4">
                    <h2 class="mb-0"><i class="fas fa-store"></i></h2>
                    <h4 class="mb-0">Sistema Zacatlán</h4>
                    <small>Acceso al personal autorizado</small>
                </div>
                <div class="card-body p-4">

                    <!-- Mensaje de error -->
                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-circle"></i>
                        Usuario o contraseña incorrectos.
                    </div>

                    <!-- Mensaje de logout -->
                    <div th:if="${param.logout}" class="alert alert-success" role="alert">
                        <i class="fas fa-check-circle"></i>
                        Has cerrado sesión correctamente.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                <i class="fas fa-user"></i> Usuario
                            </label>
                            <input type="text" class="form-control form-control-lg"
                                   id="username" name="username"
                                   placeholder="Ingresa tu usuario"
                                   required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock"></i> Contraseña
                            </label>
                            <input type="password" class="form-control form-control-lg"
                                   id="password" name="password"
                                   placeholder="Ingresa tu contraseña"
                                   required>
                        </div>

                        <!-- CSRF oculto (Spring Security lo requiere) -->
                        <input type="hidden" th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <button type="submit" class="btn btn-dark btn-lg w-100">
                            <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                        </button>
                    </form>

                    <hr class="my-4">
                    <p class="text-muted text-center mb-0">
                        <small>
                            Si no tienes cuenta, solicita tu registro al
                            <strong>Administrador del Municipio</strong>.
                        </small>
                    </p>
                </div>
            </div>
            <p class="text-center text-muted mt-3 small">
                &copy; 2026 Municipio de Zacatlán, Puebla
            </p>
        </div>
    </div>
</div>

<footer th:replace="~{plantillas/plantilla::footer}"></footer>
</body>
</html>
