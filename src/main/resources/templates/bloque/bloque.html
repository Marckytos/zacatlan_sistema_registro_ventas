<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>

<div class="container-fluid">
    <main class="container col-md-9 p-4 shadow-lg p-3 my-4 bg-body-tertiary rounded">
        <h1 class="text-center mb-4" th:text="${contenido}"></h1>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between mb-3">
            <a th:href="@{/bloque/alta-bloque}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Nuevo Bloque
            </a>
        </div>

        <table th:if="${!lista.isEmpty()}" class="table table-striped table-hover table-sm">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre del Bloque</th>
                <th class="text-center">Operaciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${lista}">
                <td th:text="${b.id}"></td>
                <td th:text="${b.nombre}"></td>
                <td class="text-center">
                    <a th:href="@{/bloque/editar-bloque/{id}(id=${b.id})}"
                       class="btn btn-sm btn-success" title="Editar">
                        <i class="fas fa-pen"></i>
                    </a>
                    <a th:href="@{/bloque/eliminar-bloque/{id}(id=${b.id})}"
                       class="btn btn-sm btn-danger" title="Eliminar"
                       onclick="return confirm('¿Eliminar este bloque? No se podrá si tiene productos asociados.');">
                        <i class="fas fa-trash"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${lista.isEmpty()}" class="alert alert-info text-center">
            <i class="fas fa-info-circle"></i> No hay bloques registrados todavía.
        </div>
    </main>
</div>

<footer th:replace="~{plantillas/plantilla::footer}"></footer>
</body>
</html>
