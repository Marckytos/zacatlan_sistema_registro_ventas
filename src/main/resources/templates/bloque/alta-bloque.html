<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>

<div class="container-fluid">
    <main class="container col-md-6 p-4 shadow-lg p-3 my-4 bg-body-tertiary rounded">
        <h1 class="text-center mb-4" th:text="${contenido}"></h1>

        <form th:action="@{/bloque/salvar-bloque}" th:object="${bloque}" method="post">

            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                Verifique los siguientes errores:
                <ul class="mb-0">
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                </ul>
            </div>

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre del bloque:</label>
                <input type="text" id="nombre" class="form-control"
                       th:field="*{nombre}" required
                       placeholder="Ej. Comida, Textiles, Manualidades...">
                <small class="text-muted">
                    Puedes agregar nuevos bloques cuando el municipio lo requiera.
                </small>
            </div>

            <input type="hidden" th:field="*{id}"/>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Guardar
                </button>
                <a th:href="@{/bloque/ver_lista}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </form>
    </main>
</div>

<footer th:replace="~{plantillas/plantilla::footer}"></footer>
</body>
</html>
