<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>

<div class="container-fluid">
    <main class="container col-md-11 p-4 shadow-lg p-3 my-4 bg-body-tertiary rounded">
        <h1 class="text-center mb-4" th:text="${contenido}"></h1>

        <!-- Mensajes flash -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between mb-3">
            <a th:href="@{/vendedor/alta-vendedor}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Nuevo Vendedor
            </a>
        </div>

        <table th:if="${!lista.isEmpty()}" class="table table-striped table-hover table-sm">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Username</th>
                <th>Estado</th>
                <th>Fecha Inactivación</th>
                <th>Última Venta</th>
                <th class="text-center">Operaciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${lista}">
                <td th:text="${v.id}"></td>
                <td th:text="${v.nombre}"></td>
                <td th:text="${v.username}"></td>
                <td>
                    <span th:if="${v.activo}" class="badge bg-success">
                        <i class="fas fa-check"></i> Activo
                    </span>
                    <span th:if="${!v.activo}" class="badge bg-danger">
                        <i class="fas fa-ban"></i> Inactivo
                    </span>
                </td>
                <td>
                    <span th:if="${v.fechaInactivacion != null}"
                          th:text="${#temporals.format(v.fechaInactivacion, 'dd/MM/yyyy HH:mm')}"></span>
                    <span th:if="${v.fechaInactivacion == null}" class="text-muted">—</span>
                </td>
                <td>
                    <span th:if="${v.ultimaVenta != null}"
                          th:text="${#temporals.format(v.ultimaVenta, 'dd/MM/yyyy HH:mm')}"></span>
                    <span th:if="${v.ultimaVenta == null}" class="text-muted">Sin ventas</span>
                </td>
                <td class="text-center">
                    <a th:href="@{/vendedor/editar-vendedor/{id}(id=${v.id})}"
                       class="btn btn-sm btn-success" title="Editar">
                        <i class="fas fa-pen"></i>
                    </a>
                    <a th:if="${v.activo}"
                       th:href="@{/vendedor/desactivar/{id}(id=${v.id})}"
                       class="btn btn-sm btn-warning" title="Desactivar"
                       onclick="return confirm('¿Desactivar a este vendedor? Se guardará su última venta.');">
                        <i class="fas fa-user-slash"></i>
                    </a>
                    <a th:if="${!v.activo}"
                       th:href="@{/vendedor/activar/{id}(id=${v.id})}"
                       class="btn btn-sm btn-info" title="Activar">
                        <i class="fas fa-user-check"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${lista.isEmpty()}" class="alert alert-info text-center">
            <i class="fas fa-info-circle"></i> No hay vendedores registrados todavía.
        </div>
    </main>
</div>

<footer th:replace="~{plantillas/plantilla::footer}"></footer>
</body>
</html>
