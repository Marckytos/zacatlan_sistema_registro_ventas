<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>

<div class="container-fluid">
    <main class="container col-md-11 p-4 shadow-lg p-3 my-4 bg-body-tertiary rounded">
        <h1 class="text-center mb-4" th:text="${contenido}"></h1>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between mb-3">
            <a th:href="@{/producto/alta-producto}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Nuevo Producto
            </a>
        </div>

        <table th:if="${!lista.isEmpty()}" class="table table-striped table-hover table-sm">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Producto</th>
                <th>Bloque</th>
                <th>Precio</th>
                <th>Estado</th>
                <th class="text-center">Operaciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${lista}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.nombre}"></td>
                <td th:text="${p.bloque != null ? p.bloque.nombre : ''}"></td>
                <td>$<span th:text="${#numbers.formatDecimal(p.precio, 1, 2)}"></span></td>
                <td>
                    <span th:if="${p.aprobado}" class="badge bg-success">
                        <i class="fas fa-check"></i> Aprobado
                    </span>
                    <span th:if="${!p.aprobado}" class="badge bg-warning text-dark">
                        <i class="fas fa-clock"></i> Pendiente
                    </span>
                </td>
                <td class="text-center">
                    <a th:href="@{/producto/editar-producto/{id}(id=${p.id})}"
                       class="btn btn-sm btn-success" title="Editar">
                        <i class="fas fa-pen"></i>
                    </a>
                    <a th:if="${!p.aprobado}"
                       th:href="@{/producto/aprobar/{id}(id=${p.id})}"
                       class="btn btn-sm btn-info" title="Aprobar"
                       onclick="return confirm('¿Aprobar este producto para venta?');">
                        <i class="fas fa-check"></i>
                    </a>
                    <a th:href="@{/producto/eliminar-producto/{id}(id=${p.id})}"
                       class="btn btn-sm btn-danger" title="Eliminar"
                       onclick="return confirm('¿Eliminar este producto? No se podrá si tiene ventas asociadas.');">
                        <i class="fas fa-trash"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${lista.isEmpty()}" class="alert alert-info text-center">
            <i class="fas fa-info-circle"></i> No hay productos registrados todavía.
        </div>
    </main>
</div>

<footer th:replace="~{plantillas/plantilla::footer}"></footer>
</body>
</html>
