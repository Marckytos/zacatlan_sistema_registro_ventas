<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Zacatlán - Sistema Municipal</title>
</head>
<body>
<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-store"></i> Sistema Zacatlán
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <!-- ========= INICIO (todos) ========= -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="fas fa-home"></i> Inicio
                        </a>
                    </li>

                    <!-- ========= SOLO ADMIN ========= -->
                    <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link dropdown-toggle" href="#" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-users"></i> Vendedores
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/vendedor/ver_lista}">Lista</a></li>
                            <li><a class="dropdown-item" th:href="@{/vendedor/alta-vendedor}">Crear vendedor</a></li>
                        </ul>
                    </li>

                    <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link dropdown-toggle" href="#" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-layer-group"></i> Bloques
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/bloque/ver_lista}">Lista</a></li>
                            <li><a class="dropdown-item" th:href="@{/bloque/alta-bloque}">Crear bloque</a></li>
                        </ul>
                    </li>

                    <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link dropdown-toggle" href="#" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-box"></i> Productos
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/producto/ver_lista}">Lista</a></li>
                            <li><a class="dropdown-item" th:href="@{/producto/alta-producto}">Crear producto</a></li>
                        </ul>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/venta/ver_lista}">
                            <i class="fas fa-shopping-cart"></i> Ventas
                        </a>
                    </li>

                    <!-- ========= SOLO VENDEDOR ========= -->
                    <li class="nav-item" sec:authorize="hasRole('VENDEDOR')">
                        <a class="nav-link" th:href="@{/venta/registrar}">
                            <i class="fas fa-plus-circle"></i> Registrar Venta
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('VENDEDOR')">
                        <a class="nav-link" th:href="@{/venta/mis-ventas}">
                            <i class="fas fa-receipt"></i> Mis Ventas
                        </a>
                    </li>
                </ul>

                <!-- ========= USUARIO Y LOGOUT ========= -->
                <ul class="navbar-nav ms-auto" sec:authorize="isAuthenticated()">
                    <li class="nav-item">
                        <span class="navbar-text me-3">
                            <i class="fas fa-user-circle"></i>
                            <span sec:authentication="name"></span>
                        </span>
                    </li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-light btn-sm">
                                <i class="fas fa-sign-out-alt"></i> Salir
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
</body>
<footer th:fragment="footer">
    <script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>
</footer>
</html>
