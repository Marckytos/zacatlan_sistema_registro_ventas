<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>

<div class="container-fluid">
    <main class="container col-md-8 p-4 shadow-lg p-3 my-4 bg-body-tertiary rounded">
        <h1 class="text-center mb-4" th:text="${contenido}"></h1>

        <div th:if="${error}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
        </div>

        <div class="alert alert-info">
            <i class="fas fa-user"></i>
            Vendedor: <strong th:text="${venta.vendedor != null ? venta.vendedor.nombre : 'N/D'}"></strong>
            <br>
            <small class="text-muted">
                Una vez registrada la venta, no podrás modificarla.
                Si hay un error, acude al Administrador.
            </small>
        </div>

        <form th:action="@{/venta/salvar}" th:object="${venta}" method="post">

            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                Verifique los siguientes errores:
                <ul class="mb-0">
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                </ul>
            </div>

            <div class="mb-3">
                <label for="producto" class="form-label">Producto:</label>
                <select id="producto" class="form-control" th:field="*{producto.id}"
                        required onchange="calcularTotal()">
                    <option value="">-- Seleccione un producto --</option>
                    <option th:each="p : ${productos}"
                            th:value="${p.id}"
                            th:attr="data-precio=${p.precio}"
                            th:text="${p.nombre + ' ($' + #numbers.formatDecimal(p.precio,1,2) + ') - ' + (p.bloque != null ? p.bloque.nombre : '')}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label for="cantidad" class="form-label">Cantidad:</label>
                <input type="number" id="cantidad" class="form-control"
                       th:field="*{cantidad}" min="1" required
                       placeholder="Ej. 1"
                       oninput="calcularTotal()">
            </div>

            <div class="alert alert-success text-center">
                <h4 class="mb-0">
                    Total a cobrar: $<span id="preview-total">0.00</span>
                </h4>
                <small class="text-muted">
                    (El total final se calcula en el servidor al guardar)
                </small>
            </div>

            <input type="hidden" th:field="*{id}"/>

            <div class="text-center">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="fas fa-save"></i> Registrar Venta
                </button>
                <a th:href="@{/venta/mis-ventas}" class="btn btn-secondary btn-lg">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </form>
    </main>
</div>

<footer th:replace="~{plantillas/plantilla::footer}"></footer>

<script>
    function calcularTotal() {
        const select = document.getElementById('producto');
        const cantidad = document.getElementById('cantidad').value;
        const preview = document.getElementById('preview-total');

        if (select.selectedIndex <= 0 || !cantidad) {
            preview.textContent = '0.00';
            return;
        }
        const opcion = select.options[select.selectedIndex];
        const precio = parseFloat(opcion.getAttribute('data-precio'));
        const cant = parseInt(cantidad);

        if (!isNaN(precio) && !isNaN(cant) && cant > 0) {
            preview.textContent = (precio * cant).toFixed(2);
        } else {
            preview.textContent = '0.00';
        }
    }
</script>
</body>
</html>
