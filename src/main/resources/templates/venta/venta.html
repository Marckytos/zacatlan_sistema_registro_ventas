<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>

<div class="container-fluid">
    <main class="container col-md-12 p-4 shadow-lg p-3 my-4 bg-body-tertiary rounded">
        <h1 class="text-center mb-4" th:text="${contenido}"></h1>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between mb-3">
            <a th:href="@{/venta/pdf}" class="btn btn-danger">
                <i class="fas fa-file-pdf"></i> Descargar Reporte General (PDF)
            </a>
            <span class="text-muted">
                Total de ventas: <strong th:text="${lista.size()}"></strong>
            </span>
        </div>

        <table th:if="${!lista.isEmpty()}" class="table table-striped table-hover table-sm">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Vendedor</th>
                <th>Producto</th>
                <th>Bloque</th>
                <th>Cantidad</th>
                <th>Total</th>
                <th class="text-center">Operaciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${lista}">
                <td th:text="${v.id}"></td>
                <td th:text="${v.fecha != null ? #temporals.format(v.fecha, 'dd/MM/yyyy HH:mm') : ''}"></td>
                <td th:text="${v.vendedor != null ? v.vendedor.nombre : ''}"></td>
                <td th:text="${v.producto != null ? v.producto.nombre : ''}"></td>
                <td th:text="${v.producto != null && v.producto.bloque != null ? v.producto.bloque.nombre : ''}"></td>
                <td th:text="${v.cantidad}"></td>
                <td>$<span th:text="${#numbers.formatDecimal(v.total, 1, 2)}"></span></td>
                <td class="text-center">
                    <a th:href="@{/venta/editar/{id}(id=${v.id})}"
                       class="btn btn-sm btn-success" title="Modificar">
                        <i class="fas fa-pen"></i>
                    </a>
                    <!-- NO hay botón eliminar: por requerimiento del municipio -->
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${lista.isEmpty()}" class="alert alert-info text-center">
            <i class="fas fa-info-circle"></i> No hay ventas registradas todavía.
        </div>
    </main>
</div>

<footer th:replace="~{plantillas/plantilla::footer}"></footer>
</body>
</html>
